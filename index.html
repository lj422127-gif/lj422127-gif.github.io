<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music 4 Life</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter, sans-serif;
}

body{
  background:#0a0a0a;
  color:white;
  overflow:hidden;
}

/* layout */
.app{
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:240px;
  background:#000;
  padding:25px;
  border-right:1px solid #1c1c1c;
}

.logo{
  font-size:22px;
  font-weight:700;
  margin-bottom:30px;
}

.logo span{
  color:#1ED760;
}

.nav div{
  padding:12px;
  margin:6px 0;
  color:#aaa;
  cursor:pointer;
  border-radius:10px;
}

.nav div:hover{
  background:#1a1a1a;
  color:#1ED760;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* top bar */
.topbar{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #1c1c1c;
}

.search{
  width:60%;
  padding:12px 18px;
  border-radius:30px;
  border:none;
  background:#1a1a1a;
  color:white;
  outline:none;
}

/* content */
.content{
  padding:25px;
  overflow-y:auto;
}

/* song rows */
.song{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  margin-bottom:10px;
  background:#111;
  border-radius:12px;
  transition:.2s;
  cursor:pointer;
}

.song:hover{
  background:#1a1a1a;
  transform:scale(1.01);
}

.song.active{
  border-left:4px solid #1ED760;
}

.song small{
  color:#888;
}

.playBtn{
  background:#1ED760;
  border:none;
  padding:8px 14px;
  border-radius:20px;
  cursor:pointer;
  font-weight:600;
}

/* PLAYER */
.player{
  position:fixed;
  bottom:0;
  left:240px;
  right:0;
  height:90px;
  background:#000;
  border-top:1px solid #1c1c1c;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
}

.now{
  display:flex;
  flex-direction:column;
}

.now small{
  color:#888;
}

.controls button{
  background:#1ED760;
  border:none;
  padding:12px 18px;
  border-radius:30px;
  cursor:pointer;
  font-weight:700;
}

</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">MUSIC <span>4</span> LIFE</div>

  <div class="nav">
    <div>🏠 Home</div>
    <div>🔍 Search</div>
    <div>🎵 Library</div>
    <div>❤️ Liked</div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar">
    <input class="search" placeholder="Search songs or artists..." onkeyup="searchSong(this.value)">
  </div>

  <div class="content" id="list"></div>

</div>

</div>

<!-- PLAYER -->
<div class="player">

  <div class="now">
    <strong id="title">Not Playing</strong>
    <small id="artist">---</small>
  </div>

  <div class="controls">
    <button onclick="togglePlay()">▶ / ⏸</button>
  </div>

</div>

<audio id="audio"></audio>

<script>

const songs = [
  {
    title:"Never Switch (with intro)",
    artist:"Unknown Artist",
    file:"music/never-switch.mp3"
  }
];

let current = 0;
const audio = document.getElementById("audio");

function render(list = songs){
  const container = document.getElementById("list");
  container.innerHTML = "";

  list.forEach((song, i) => {
    container.innerHTML += `
      <div class="song" onclick="playSong(${i})" id="song-${i}">
        <div>
          <strong>${song.title}</strong><br>
          <small>${song.artist}</small>
        </div>
        <button class="playBtn">Play</button>
      </div>
    `;
  });
}

function playSong(i){
  current = i;

  document.getElementById("title").innerText = songs[i].title;
  document.getElementById("artist").innerText = songs[i].artist;

  audio.src = songs[i].file;
  audio.play();

  highlight();
}

function highlight(){
  songs.forEach((_, i) => {
    const el = document.getElementById("song-"+i);
    if(!el) return;
    el.classList.remove("active");
  });

  const active = document.getElementById("song-"+current);
  if(active) active.classList.add("active");
}

function togglePlay(){
  if(audio.paused){
    audio.play();
  }else{
    audio.pause();
  }
}

function searchSong(value){
  value = value.toLowerCase();

  const filtered = songs.filter(s =>
    s.title.toLowerCase().includes(value) ||
    s.artist.toLowerCase().includes(value)
  );

  render(filtered);
}

render();

</script>

</body>
</html>
