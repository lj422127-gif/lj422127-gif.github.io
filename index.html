<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUSIC 4 LIFE</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

body{
    background:#090909;
    color:white;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:700px;
    height:700px;
    background:radial-gradient(#1ed76022,transparent 70%);
    top:-250px;
    right:-250px;
    pointer-events:none;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:230px;
    height:100vh;
    background:#111;
    border-right:1px solid #1d1d1d;
    padding:35px 25px;
}

.logo{
    font-size:30px;
    font-weight:700;
    margin-bottom:60px;
    letter-spacing:2px;
}

.logo span{
    color:#1ED760;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.menu a{
    color:#bdbdbd;
    text-decoration:none;
    padding:14px 18px;
    border-radius:14px;
    transition:.25s;
}

.menu a:hover{
    background:#1ED760;
    color:black;
}

.main{
    margin-left:230px;
    padding:40px;
    padding-bottom:130px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:40px;
}

.search{
    width:380px;
    background:#151515;
    border:none;
    outline:none;
    padding:15px 22px;
    color:white;
    border-radius:50px;
    font-size:15px;
}

.profile{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#1ED760;
}

.hero{
    display:grid;
    grid-template-columns:320px 1fr;
    gap:40px;
    background:#111;
    padding:35px;
    border-radius:30px;
    margin-bottom:45px;
}

.cover{
    width:100%;
    aspect-ratio:1;
    border-radius:24px;
    background:linear-gradient(135deg,#1ED760,#0f5132);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:90px;
    box-shadow:0 20px 60px rgba(30,215,96,.15);
}

.heroText{
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.heroText small{
    color:#888;
    margin-bottom:10px;
}

.heroText h1{
    font-size:54px;
    margin-bottom:8px;
}

.heroText h3{
    color:#bbb;
    font-weight:400;
}

.controls{
    margin-top:35px;
    display:flex;
    gap:15px;
}

.controls button{
    width:58px;
    height:58px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    font-size:20px;
    transition:.25s;
}

.controls button:hover{
    transform:scale(1.08);
}

.play{
    background:#1ED760;
}

.dark{
    background:#191919;
    color:white;
}

.sectionTitle{
    display:flex;
    justify-content:space-between;
    margin-bottom:22px;
}

.sectionTitle h2{
    font-size:28px;
}

.sectionTitle p{
    color:#888;
    cursor:pointer;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:22px;
}

.card{
    background:#111;
    padding:18px;
    border-radius:22px;
    transition:.3s;
    cursor:pointer;
}

.card:hover{
    transform:translateY(-8px);
    background:#171717;
}

.art{
    width:100%;
    aspect-ratio:1;
    border-radius:18px;
    background:linear-gradient(135deg,#444,#222);
    margin-bottom:15px;
}

.card h4{
    margin-bottom:5px;
}

.card p{
    color:#888;
    font-size:14px;
}

.player{
    position:fixed;
    bottom:0;
    left:230px;
    right:0;
    height:95px;
    background:rgba(12,12,12,.96);
    backdrop-filter:blur(20px);
    border-top:1px solid #1d1d1d;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
}

.now{
    display:flex;
    align-items:center;
    gap:15px;
}

.miniCover{
    width:60px;
    height:60px;
    border-radius:14px;
    background:linear-gradient(135deg,#1ED760,#0f5132);
}

.song h4{
    margin-bottom:4px;
}

.song p{
    color:#888;
    font-size:14px;
}

.playerControls{
    display:flex;
    align-items:center;
    gap:18px;
}

.playerControls button{
    background:none;
    border:none;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.bigPlay{
    width:50px;
    height:50px;
    background:#1ED760 !important;
    color:black !important;
    border-radius:50%;
}

.volume{
    width:140px;
}

@media(max-width:900px){

.sidebar{
    display:none;
}

.main{
    margin-left:0;
}

.player{
    left:0;
}

.hero{
    grid-template-columns:1fr;
}

.search{
    width:100%;
}

.topbar{
    flex-direction:column;
    gap:20px;
}

}

</style>
</head>

<body>

<div class="sidebar">

<div class="logo">
MUSIC <span>4</span> LIFE
</div>

<div class="menu">
<a href="#">🏠 Home</a>
<a href="#">🎤 Artists</a>
<a href="#">🎵 Songs</a>
<a href="#">💿 Albums</a>
<a href="#">❤️ Liked</a>
</div>

</div>

<div class="main">

<div class="topbar">

<input class="search" placeholder="🔍 Search songs or artists...">

<div class="profile"></div>

</div>

<div class="hero">

<div class="cover">
♪
</div>

<div class="heroText">

<small>FEATURED TODAY</small>

<h1>Blinding Lights</h1>

<h3>The Weeknd</h3>

<div class="controls">

<button class="dark">⏮</button>

<button class="play">▶</button>

<button class="dark">⏭</button>

</div>

</div>

</div>

<div class="sectionTitle">
<h2>Trending</h2>
<p>View All</p>
</div>

<div class="grid">

<div class="card">
<div class="art"></div>
<h4>Starboy</h4>
<p>The Weeknd</p>
</div>

<div class="card">
<div class="art"></div>
<h4>Lose Yourself</h4>
<p>Eminem</p>
</div>

<div class="card">
<div class="art"></div>
<h4>Shape of You</h4>
<p>Ed Sheeran</p>
</div>

<div class="card">
<div class="art"></div>
<h4>Hello</h4>
<p>Adele</p>
</div>

<div class="card">
<div class="art"></div>
<h4>HUMBLE.</h4>
<p>Kendrick Lamar</p>
</div>

<div class="card">
<div class="art"></div>
<h4>God's Plan</h4>
<p>Drake</p>
</div>

</div>

</div>

<div class="player">

<div class="now">

<div class="miniCover"></div>

<div class="song">
<h4>Blinding Lights</h4>
<p>The Weeknd</p>
</div>

</div>

<div class="playerControls">

<button>⏮</button>
<button class="bigPlay">▶</button>
<button>⏭</button>

</div>

<input class="volume" type="range">

</div>

</body>
</html>
