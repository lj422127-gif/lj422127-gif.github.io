<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUSIC 4 LIFE</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Inter,sans-serif;
}

body{
  background:#0b0b0b;
  color:white;
}

/* layout */
.wrapper{
  display:flex;
  height:100vh;
}

/* sidebar */
.sidebar{
  width:220px;
  background:#111;
  padding:30px;
}

.logo{
  font-size:24px;
  font-weight:700;
  margin-bottom:40px;
}

.logo span{
  color:#1ED760;
}

.menu div{
  padding:12px;
  color:#aaa;
  cursor:pointer;
}

.menu div:hover{
  color:#1ED760;
}

/* main */
.main{
  flex:1;
  padding:30px;
}

/* top */
.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:30px;
}

.search{
  width:60%;
  padding:12px 18px;
  border-radius:30px;
  border:none;
  background:#1a1a1a;
  color:white;
}

/* songs */
.songList{
  margin-top:20px;
}

.song{
  display:flex;
  justify-content:space-between;
  padding:15px;
  margin-bottom:10px;
  background:#151515;
  border-radius:12px;
  cursor:pointer;
}

.song:hover{
  background:#1f1f1f;
}

.song button{
  background:#1ED760;
  border:none;
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
}

/* player */
.player{
  position:fixed;
  bottom:0;
  left:220px;
  right:0;
  background:#111;
  padding:15px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-top:1px solid #222;
}

.now{
  display:flex;
  flex-direction:column;
}

.controls button{
  background:#1ED760;
  border:none;
  padding:10px 16px;
  border-radius:50px;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="wrapper">

<!-- sidebar -->
<div class="sidebar">
  <div class="logo">MUSIC <span>4</span> LIFE</div>
  <div class="menu">
    <div>Home</div>
    <div>Artists</div>
    <div>Songs</div>
  </div>
</div>

<!-- main -->
<div class="main">

  <div class="top">
    <input class="search" placeholder="Search songs..." onkeyup="searchSong(this.value)">
  </div>

  <h2>Song Library</h2>

  <div class="songList" id="songList"></div>

</div>

</div>

<!-- player -->
<div class="player">

  <div class="now">
    <strong id="title">Not playing</strong>
    <small id="artist">---</small>
  </div>

  <div class="controls">
    <button onclick="togglePlay()">▶ / ⏸</button>
  </div>

</div>

<audio id="audio"></audio>

<script>

const songs = [
  {
    title: "Never Switch (with intro)",
    artist: "Unknown",
    file: "music/never-switch.mp3"
  }
];

let current = 0;

const audio = document.getElementById("audio");

function loadSongs(list = songs){
  const container = document.getElementById("songList");
  container.innerHTML = "";

  list.forEach((song, i) => {
    container.innerHTML += `
      <div class="song">
        <div>
          <strong>${song.title}</strong><br>
          <small>${song.artist}</small>
        </div>
        <button onclick="playSong(${i})">Play</button>
      </div>
    `;
  });
}

function playSong(i){
  current = i;

  document.getElementById("title").innerText = songs[i].title;
  document.getElementById("artist").innerText = songs[i].artist;

  audio.src = songs[i].file;
  audio.play();
}

function togglePlay(){
  if(audio.paused){
    audio.play();
  }else{
    audio.pause();
  }
}

function searchSong(value){
  value = value.toLowerCase();

  const filtered = songs.filter(s =>
    s.title.toLowerCase().includes(value) ||
    s.artist.toLowerCase().includes(value)
  );

  const container = document.getElementById("songList");
  container.innerHTML = "";

  filtered.forEach((song, i) => {
    container.innerHTML += `
      <div class="song">
        <div>
          <strong>${song.title}</strong><br>
          <small>${song.artist}</small>
        </div>
        <button onclick="playSong(${songs.indexOf(song)})">Play</button>
      </div>
    `;
  });
}

loadSongs();

</script>

</body>
</html>
